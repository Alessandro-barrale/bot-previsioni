name: Previsioni (torneo stagionale + MiniBench)

# Chi sveglia il bot (vedi SVEGLIA.md):
# 1. cron-job.org ogni 30 minuti (workflow_dispatch): e' la sveglia principale,
#    perche' GitHub esegue il suo cron quando vuole (3 giri in 14 ore il 21/10).
# 2. Il PC dell'utente (sveglia_bot.ps1, ogni 10 minuti) solo se l'ultimo giro
#    e' piu' vecchio di 25 minuti.
# 3. Il cron di GitHub qui sotto, ogni 6 ore, come ultima riserva.
# Conto dei minuti (repo privato, 2.000 gratuiti al mese, ogni giro vale almeno
# 1 minuto): 48 giri al giorno x 30 = 1.440, piu' 120 del cron, piu' il tempo
# delle domande vere (2-3 minuti l'una): circa 1.850 al mese.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

# Lo stesso gruppo per tutti i workflow che scrivono nel registro: mai due giri insieme.
concurrency:
  group: bot-previsioni
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  previsioni:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Installa le dipendenze
        run: uv sync --frozen --no-dev --python 3.11
      - name: Fai le previsioni
        run: uv run --no-sync python main.py --modo torneo
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Variabili del repository (non segrete). L'invio parte solo con INVIA_PREVISIONI = si.
          INVIA_PREVISIONI: ${{ vars.INVIA_PREVISIONI }}
          MODELLI_PREVISIONE: ${{ vars.MODELLI_PREVISIONE }}
          # Tetti v2 (predefiniti se vuoti): 0,90 $ a domanda, 15 $ al giorno, 150 $ al mese
          # (variabile del repo: 100 $, perche' l'area di lavoro Anthropic ha un limite di 120 $);
          # obiettivo medio 0,50 $ a domanda.
          TETTO_DOMANDA_USD: ${{ vars.TETTO_DOMANDA_USD }}
          TETTO_GIORNO_USD: ${{ vars.TETTO_GIORNO_USD }}
          TETTO_MESE_USD: ${{ vars.TETTO_MESE_USD }}
          # Interruttori delle fonti v2 (accese se vuote; "no" per spegnere).
          FONTE_RISOLUZIONE: ${{ vars.FONTE_RISOLUZIONE }}
          MERCATI: ${{ vars.MERCATI }}
          KALSHI: ${{ vars.KALSHI }}
          SERIE_STORICHE: ${{ vars.SERIE_STORICHE }}
      # Bot secondario (antivex-bot-2, non premiato): test A/B sul solo MiniBench.
      # Stesso prompt e stessi modelli della primaria, ma ricerca solo web (come la v1):
      # misura quanto valgono le fonti nuove (pagina di risoluzione, mercati, serie, AskNews).
      # Parte solo con BOT_2_ATTIVO = si; un suo errore non rende rosso il giro.
      - name: Bot secondario (A/B, solo MiniBench, ricerca solo web)
        if: vars.BOT_2_ATTIVO == 'si'
        continue-on-error: true
        run: uv run --no-sync python main.py --modo minibench --bot 2
        env:
          METACULUS_TOKEN_2: ${{ secrets.METACULUS_TOKEN_2 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INVIA_PREVISIONI: ${{ vars.INVIA_PREVISIONI_2 }}
          MODELLI_PREVISIONE: ${{ vars.MODELLI_PREVISIONE }}
          TETTO_DOMANDA_USD: ${{ vars.TETTO_DOMANDA_USD }}
          TETTO_GIORNO_USD: "5"
          TETTO_MESE_USD: ${{ vars.TETTO_MESE_USD_2 }}
          FONTE_RISOLUZIONE: "no"
          MERCATI: "no"
          SERIE_STORICHE: "no"
      - name: Salva il registro delle spese e delle previsioni
        if: always()
        run: |
          git config user.name "bot-previsioni"
          git config user.email "bot-previsioni@users.noreply.github.com"
          for f in dati/registro.sqlite dati/registro_v2.sqlite; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Registro: giro del $(date -u +%Y-%m-%dT%H:%M)Z"
          git pull --rebase --quiet
          git push --quiet
