name: Prova (test + domande di prova, senza invio)

# Solo a mano. Non invia mai: INVIA_PREVISIONI è forzato a "no".
on:
  workflow_dispatch:
    inputs:
      domande_vere:
        description: "Prova anche sulle domande dell'area di prova di Metaculus (spende crediti dei modelli)"
        type: boolean
        default: false
      market_pulse:
        description: "Prova Market Pulse senza invio (al massimo 3 sotto-domande, spende crediti dei modelli)"
        type: boolean
        default: false

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Controllo delle chiavi (stampa solo l'inizio e la lunghezza)
        run: |
          k="$ANTHROPIC_API_KEY"
          echo "ANTHROPIC_API_KEY: inizia con '${k:0:10}', lunga ${#k} caratteri"
          case "$k" in *[[:space:]]*) echo "ATTENZIONE: la chiave contiene spazi o a capo";; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.anthropic.com/v1/models \
            -H "x-api-key: $k" -H "anthropic-version: 2023-06-01")
          echo "Risposta di Anthropic: HTTP $code (200 = chiave valida, 401 = chiave non valida)"
          utente=$(curl -s https://www.metaculus.com/api/users/me/ -H "Authorization: Token $METACULUS_TOKEN"             | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('username'), '(bot)' if d.get('is_bot') else '')")
          echo "Bot su Metaculus: $utente"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - run: uv sync --frozen --python 3.11
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Prova offline con il modello finto
        run: uv run --no-sync python main.py --modo prova_offline
        env:
          MODELLO_FINTO: "si"
          PERCORSO_REGISTRO: /tmp/prova.sqlite
      - name: Prova sulle domande dell'area di prova (senza invio)
        if: inputs.domande_vere
        run: uv run --no-sync python main.py --modo test_questions
        env:
          INVIA_PREVISIONI: "no"
          PERCORSO_REGISTRO: /tmp/prova-vera.sqlite
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Prova Market Pulse (senza invio, al massimo 3 sotto-domande)
        if: inputs.market_pulse
        run: uv run --no-sync python main.py --modo market_pulse
        env:
          INVIA_PREVISIONI: "no"
          PERCORSO_REGISTRO: /tmp/prova-mp.sqlite
          MP_DOMANDE_PER_GIRO: "3"
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          MODELLI_PREVISIONE: ${{ vars.MODELLI_PREVISIONE }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
